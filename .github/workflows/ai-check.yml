name: AI subtitle acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  subtitles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx puppeteer browsers install chrome
      - run: npm run test:ai
